<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Reserva de habitación</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <form action="reserva.php" method="get">

        <fieldset>
            <legend>Datos del solicitante</legend>

            <label for="nombre">Nombre del solicitante de la reserva:</label>
            <input type="text" id="nombre" name="nombre" maxlength="100" required autofocus>
            <br><br>

            <label for="telefono">Teléfono de contacto:</label>
            <input type="tel" id="telefono" name="telefono" maxlength="9" pattern="[0-9]{9}" title="9 números" required placeholder="9 números">
            <br><br>

            <label for="dni">DNI (Seleccione un archivo de imagen):</label>
            <input type="file" id="dni" name="dni" accept=".pdf,.jpg,.jpeg,.png" required>
            <br><br>
        </fieldset>
        <fieldset>
            <legend>Datos de la reserva</legend>

            <label for="habitacion">Habitación:</label>
            <select id="habitacion" name="habitacion">
                <option selected>Azul</option>
                <option>Verde</option>
                <option>Amarilla</option>
                <option>Morada</option>
            </select>
            <br><br>

            <label for="tipo">Ocupación:</label>
            <select id="tipo" name="tipo">
                <option>Individual</option>
                <option selected>Doble</option>
            </select>
            <br><br>

            <label for="provincia">Provincia:</label>
            <select id="provincia" name="provincia">
                <optgroup label="Galicia">
                    <option>La Coruña</option>
                    <option>Lugo</option>
                    <option>Orense</option>
                    <option>Pontevedra</option>
                </optgroup>
                <optgroup label="País Vasco">
                    <option>Vizcaya</option>
                    <option>Guipúzcoa</option>
                    <option>Álava</option>
                </optgroup>
            </select>
        </fieldset>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">

    </form>    
</body>
</html>
