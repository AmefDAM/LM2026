<!DOCTYPE html>
<html lang='en'>
<head>
    <title>Ejercicio de pseudo-clases</title>
    <style>
        li:nth-child(even) {
            color:red;
            font-size: 40px;
        }
        li:first-child {
            color: blue;
        }
        li:nth-child(3) {
            color: orange;
            font-size: 20px;
        }
        li:last-child {
            color: green;
            font-size: 60px;;
        }
    </style>
</head>
<body>
    <ul>
        <li>Primero</li>
        <li>Segundo</li>
        <li>Tercero</li>
        <li>Cuarto</li>
        <li>Quinto</li>
    </ul>
</body>
</html>
